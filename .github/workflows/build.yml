name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # net48 needs the .NET Framework targeting pack that ships with the Windows runners.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # The library is built with 0 warnings (CS1591/CS1573 enabled), so warnings fail the build.
      - name: Build
        run: dotnet build TeklaHelper.DrawingNative.csproj -c Release -warnaserror -p:ContinuousIntegrationBuild=true

      - name: Pack
        run: dotnet pack TeklaHelper.DrawingNative.csproj -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg
