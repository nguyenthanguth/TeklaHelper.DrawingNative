name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    # Windows runner: the library targets .NET Framework 4.8 (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore TeklaHelper.DrawingNative.csproj

      # The library is built with 0 warnings (CS1591/CS1573 enabled), so warnings fail the build.
      - name: Build
        run: dotnet build TeklaHelper.DrawingNative.csproj -c Release --no-restore -warnaserror

      - name: Pack
        run: dotnet pack TeklaHelper.DrawingNative.csproj -c Release --no-build -o artifacts

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: artifacts/*
          if-no-files-found: error
